<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fu-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23487A" />
      <stop offset="100%" stop-color="#132645" />
    </linearGradient>
    <linearGradient id="fu-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E53E3E" />
      <stop offset="100%" stop-color="#C53030" />
    </linearGradient>
    <clipPath id="fu-arch-clip">
      <path d="M9 31 C9 16.5, 21 8.5, 32 5.5 C43 8.5, 55 16.5, 55 31 L55 51 C55 54.5, 52.5 57, 49 57 L15 57 C11.5 57, 9 54.5, 9 51 Z" />
    </clipPath>
  </defs>

  <!-- Deep Navy App Badge -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#fu-navy)" />

  <!-- Crisp White Mihrab / Arch -->
  <path d="M9 31 C9 16.5, 21 8.5, 32 5.5 C43 8.5, 55 16.5, 55 31 L55 51 C55 54.5, 52.5 57, 49 57 L15 57 C11.5 57, 9 54.5, 9 51 Z" fill="#FFFFFF" />

  <!-- Crimson Red Base Ribbon Clipped Inside Arch -->
  <rect x="8" y="49.5" width="48" height="9" fill="url(#fu-red)" clip-path="url(#fu-arch-clip)" />

  <!-- Isometric Kaaba (top-left lighting) -->
  <!-- Roof -->
  <polygon points="32,16.5 47.5,22 32,27.5 16.5,22" fill="#334155" />
  <!-- Left Face -->
  <polygon points="16.5,22 32,27.5 32,46.5 16.5,41" fill="#1E293B" />
  <!-- Right Face -->
  <polygon points="32,27.5 47.5,22 47.5,41 32,46.5" fill="#0F172A" />

  <!-- Gold Kiswah Band -->
  <polygon points="16.5,26 32,31.5 32,35.2 16.5,29.7" fill="#FBBF24" />
  <polygon points="32,31.5 47.5,26 47.5,29.7 32,35.2" fill="#D97706" />

  <!-- Gold Door (Multazam / Bab al-Kaaba) -->
  <polygon points="37.2,35.6 41.4,34.1 41.4,43.2 37.2,44.7" fill="#F59E0B" />
</svg>
